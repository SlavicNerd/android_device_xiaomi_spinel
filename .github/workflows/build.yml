name: Build OrangeFox Recovery - Redmi Note 15 4G (spinel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 2048
        swap-size-mb: 0
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Free Additional Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        echo "Disk usage after cleanup:"
        df -h

    - name: Set up Swap Space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf build-essential libssl-dev libxml2-utils xsltproc fontconfig \
          pngcrush imagemagick zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-dev readline-common libncurses5 \
          git flex bison python3 python-is-python3 repo ccache

    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync Source from GitLab
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"

        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git

        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Verify OrangeFox Source Sync
      run: |
        echo "Disk usage after sync:"
        df -h

        if [ ! -f ~/fox_12.1/vendor/fox/config/common.mk ]; then
          echo "::error::vendor/fox is missing - the OrangeFox sync did not complete."
          echo "This is almost always disk space or a network failure during repo sync."
          echo "Contents of ~/fox_12.1:"
          ls -la ~/fox_12.1 || true
          exit 1
        fi

        echo "vendor/fox is present - sync looks complete."

    - name: Copy Device Tree & Build Recovery
      shell: /usr/bin/bash {0}
      run: |
        # Ensure target folder exists and copy tree
        mkdir -p ~/fox_12.1/device/xiaomi/spinel
        cp -r $GITHUB_WORKSPACE/* ~/fox_12.1/device/xiaomi/spinel/

        # Fail fast if the device tree didn't land where expected
        if [ ! -f ~/fox_12.1/device/xiaomi/spinel/device.mk ]; then
          echo "::error::device.mk not found after copying device tree into ~/fox_12.1/device/xiaomi/spinel"
          ls -la ~/fox_12.1/device/xiaomi/spinel || true
          exit 1
        fi

        cd ~/fox_12.1

        # Explicit Environment Exports
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export TW_THEME="portrait_hdpi"
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2400

        # Disable set -e temporarily for env setup
        set +e
        source build/envsetup.sh
        lunch fox_spinel-eng
        LUNCH_EXIT_CODE=$?
        set -e

        if [ $LUNCH_EXIT_CODE -ne 0 ]; then
          echo "Error: lunch target fox_spinel-eng failed with exit status $LUNCH_EXIT_CODE"
          exit 1
        fi

        # Compile recovery with job limiting
        mka recoveryimage -j2

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-spinel-Build
        path: |
          /home/runner/fox_12.1/out/target/product/spinel/OrangeFox*.img
          /home/runner/fox_12.1/out/target/product/spinel/OrangeFox*.zip
          /home/runner/fox_12.1/out/target/product/spinel/recovery.img
