name: Build OrangeFox Recovery - Redmi Note 15 4G (spinel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true
        sudo apt-get clean
        echo "=== Disk usage after cleanup ==="
        df -h

    - name: Prepare Build Volume
      run: |
        # Don't assume /mnt is the big disk - pick whichever has more free space.
        ROOT_FREE=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        MNT_FREE=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')
        echo "Free space: / = ${ROOT_FREE}G, /mnt = ${MNT_FREE}G"

        if [ "$MNT_FREE" -gt "$ROOT_FREE" ]; then
          BASE=/mnt/fox
        else
          BASE=/home/runner/fox
        fi

        sudo mkdir -p "$BASE/fox_12.1" "$BASE/sync" "$BASE/ccache"
        sudo chown -R "$USER:$USER" "$BASE"

        {
          echo "BUILD_BASE=$BASE"
          echo "FOX_ROOT=$BASE/fox_12.1"
          echo "SYNC_DIR=$BASE/sync"
          echo "CCACHE_DIR=$BASE/ccache"
        } >> "$GITHUB_ENV"

        echo "Using $BASE"
        df -h "$BASE"

    - name: Set up Swap Space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile "$BUILD_BASE/swapfile"
        sudo fallocate -l 8G "$BUILD_BASE/swapfile" || sudo dd if=/dev/zero of="$BUILD_BASE/swapfile" bs=1M count=8192
        sudo chmod 600 "$BUILD_BASE/swapfile"
        sudo mkswap "$BUILD_BASE/swapfile"
        sudo swapon "$BUILD_BASE/swapfile"
        free -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf build-essential libssl-dev libxml2-utils xsltproc fontconfig \
          pngcrush imagemagick zip unzip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-dev readline-common rsync \
          git flex bison python3 python-is-python3 ccache bc lz4 libelf-dev
        # ncurses package names differ across releases - try both, don't fail the job
        sudo apt-get install -y lib32ncurses-dev libncurses5 || \
          sudo apt-get install -y lib32ncurses5-dev libncurses5 || true

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device_tree

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync Source from GitLab
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
        git config --global color.ui false

        cd "$SYNC_DIR"
        # Correct repo is OrangeFox/sync (not "Sync/orangefox_sync.sh")
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path "$FOX_ROOT"

    - name: Verify OrangeFox Source Sync
      run: |
        echo "=== Disk usage after sync ==="
        df -h

        # OrangeFox keeps its vendor files in vendor/recovery (there is no vendor/fox)
        if [ ! -d "$FOX_ROOT/vendor/recovery" ] || [ -z "$(ls -A "$FOX_ROOT/vendor/recovery")" ]; then
          echo "::error::vendor/recovery is missing or empty - the OrangeFox sync did not complete."
          echo "Usually caused by running out of disk space or a network failure during repo sync."
          echo "--- Contents of $FOX_ROOT ---"
          ls -la "$FOX_ROOT" || true
          echo "--- Contents of $FOX_ROOT/vendor ---"
          ls -la "$FOX_ROOT/vendor" || true
          exit 1
        fi

        if [ ! -f "$FOX_ROOT/build/envsetup.sh" ]; then
          echo "::error::build/envsetup.sh is missing - the source tree is incomplete."
          exit 1
        fi

        echo "Sync looks complete."

    - name: Copy Device Tree
      run: |
        mkdir -p "$FOX_ROOT/device/xiaomi/spinel"
        rsync -a --exclude='.git' "$GITHUB_WORKSPACE/device_tree/" "$FOX_ROOT/device/xiaomi/spinel/"

        if [ ! -f "$FOX_ROOT/device/xiaomi/spinel/device.mk" ]; then
          echo "::error::device.mk not found after copying the device tree."
          echo "Check that your repository root contains device.mk (not nested in a subfolder)."
          ls -la "$FOX_ROOT/device/xiaomi/spinel" || true
          exit 1
        fi

        echo "--- Device tree contents ---"
        ls -la "$FOX_ROOT/device/xiaomi/spinel"

    - name: Build Recovery
      shell: /usr/bin/bash {0}
      run: |
        cd "$FOX_ROOT"
        DEV=device/xiaomi/spinel

        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache

        # --- Work out the lunch prefix from the device tree (twrp_ on 12.1, fox_ on some trees) ---
        PREFIX=""
        for p in twrp fox omni; do
          if [ -f "$DEV/${p}_spinel.mk" ]; then PREFIX="$p"; break; fi
        done
        if [ -z "$PREFIX" ]; then
          echo "::error::No <prefix>_spinel.mk found in $DEV - cannot pick a lunch combo."
          ls -la "$DEV"
          exit 1
        fi
        echo "Lunch combo: ${PREFIX}_spinel-eng"

        # --- Work out the correct make target from BoardConfig ---
        if grep -qsE "BOARD_USES_RECOVERY_AS_BOOT *:?= *true" "$DEV"/BoardConfig*.mk; then
          TARGET="bootimage"
        elif grep -qsE "BOARD_MOVE_RECOVERY_TO_VENDOR_BOOT *:?= *true" "$DEV"/BoardConfig*.mk; then
          TARGET="vendorbootimage"
        else
          TARGET="recoveryimage"
        fi
        echo "Make target: $TARGET"

        set +e
        source build/envsetup.sh
        lunch "${PREFIX}_spinel-eng"
        LUNCH_EXIT_CODE=$?
        set -e

        if [ $LUNCH_EXIT_CODE -ne 0 ]; then
          echo "::error::lunch ${PREFIX}_spinel-eng failed with exit status $LUNCH_EXIT_CODE"
          exit 1
        fi

        if [ "$TARGET" != "recoveryimage" ]; then
          mka adbd
        fi
        mka "$TARGET" -j"$(nproc)"

    - name: Upload Recovery Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-spinel-Build
        if-no-files-found: warn
        path: |
          ${{ env.FOX_ROOT }}/out/target/product/spinel/OrangeFox*.img
          ${{ env.FOX_ROOT }}/out/target/product/spinel/OrangeFox*.zip
          ${{ env.FOX_ROOT }}/out/target/product/spinel/recovery.img
          ${{ env.FOX_ROOT }}/out/target/product/spinel/boot.img
          ${{ env.FOX_ROOT }}/out/target/product/spinel/vendor_boot.img
